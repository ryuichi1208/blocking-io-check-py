name: Lint and Format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen --group dev

    - name: Lint with ruff
      run: uv run ruff check .

    - name: Format check with ruff
      run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen --group dev --python ${{ matrix.python-version }}

    # The test suite deliberately requires neither root, nor BCC, nor Linux
    # kernel probes. Everything except runtime.py is pure Python.
    - name: Run tests
      run: uv run pytest --cov=blockingio --cov-report=term-missing

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen --group dev

    - name: Typecheck with mypy
      run: uv run mypy

  # This job is the enforcement mechanism for "the Python side does not depend on
  # bcc or Linux". Without it, someone adds a top-level `import bcc` and nobody
  # notices until a contributor on a Mac cannot run the tests.
  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen --group dev

    - name: Run tests
      run: uv run pytest

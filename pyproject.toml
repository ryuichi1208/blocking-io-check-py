[project]
name = "blocking-io-check"
version = "0.2.0"
description = "eBPF tool that detects blocking socket and file I/O in Python applications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ryuichi1208" }]
keywords = ["ebpf", "bcc", "asyncio", "blocking-io", "tracing", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]

# NOTE: BCC (the `bcc` Python module from iovisor/bcc) is deliberately NOT listed
# here. It is distro-packaged and cannot be installed from PyPI:
#   Ubuntu/Debian: sudo apt install python3-bpfcc bpfcc-tools
#   Fedora/RHEL:   sudo dnf install python3-bcc bcc-tools
#   Arch:          sudo pacman -S python-bcc bcc-tools
# The PyPI package named "bcc" is an unrelated project - do not depend on it.
dependencies = []

[project.scripts]
blocking-io-check = "blockingio.cli:main"

[project.urls]
Homepage = "https://github.com/ryuichi1208/blocking-io-check-py"
Issues = "https://github.com/ryuichi1208/blocking-io-check-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blockingio"]

[tool.hatch.build.targets.wheel.force-include]
"blockingio/bpf/trace.bpf.c" = "blockingio/bpf/trace.bpf.c"

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-cov>=5.0",
  "ruff>=0.12.12",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF002/RUF003 flag full-width punctuation as "ambiguous unicode", which is a
# false positive for the Japanese comments and docstrings in this codebase.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
files = ["blockingio"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "bcc.*"
ignore_missing_imports = true
